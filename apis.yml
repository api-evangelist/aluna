name: Aluna
description: >-
  Aluna is a digital respiratory health company behind an FDA-cleared, portable
  Bluetooth spirometer and companion mobile app that let people with asthma,
  COPD, and cystic fibrosis measure lung function (FEV1) at home and share the
  results with their care teams. The platform pairs a hospital-grade sensor with
  a gamified app and machine-learning analytics to encourage proper technique,
  track symptoms, triggers, and medications, and surface trends that help
  clinicians intervene before an exacerbation. Founded by Charvi Shetty and
  Inderjit Jutla out of UC Berkeley's bioengineering program, Aluna raised a
  $15.3M Series B and is a Matrix Partners portfolio company; the product is now
  operated under Huma Therapeutics. Aluna publishes consumer, clinical-provider,
  and clinical-trial surfaces but no public developer API.
